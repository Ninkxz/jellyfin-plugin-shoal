name: "Shoal"
guid: "b3d48170-08c3-4272-8042-efb38df9bb24"
version: "2.9.2.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Share libraries between friends' Jellyfin servers. Nothing copied, nothing exposed."
description: >
  Shoal for Jellyfin: a friend's titles show up in your library as lightweight
  .strm/.nfo entries and play through an authenticated plugin proxy, with the
  friend's server deciding between direct play and transcoding for your client.
  Nothing is copied and nothing is exposed.
category: "General"
owner: "Ninkxz"
artifacts:
- "Jellyfin.Plugin.Shoal.dll"
changelog: >
  Shoal 2.9.4: fixes a series that several friends share showing up two or three times, and episodes listed twice. A friend extra episodes now join another friend series only when the library you combined into has Automatically merge series turned on, and each friend episodes are checked against every higher ranked friend, not just the first. Shoal also warns when that library has merging off, and fixes a label that said Server twice. Servers with copies already on disk may show a removals on hold box after the upgrade: press Remove them now.
