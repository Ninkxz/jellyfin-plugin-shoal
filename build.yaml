name: "Shoal"
guid: "b3d48170-08c3-4272-8042-efb38df9bb24"
version: "2.10.4.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
overview: "Share libraries between friends' Jellyfin servers. Media stays on its original server."
description: >
  Shoal for Jellyfin: a friend's titles show up in your library as lightweight
  .strm/.nfo entries and play through an authenticated plugin proxy, with the
  friend's server deciding between direct play and transcoding for your client.
  Media stays on its original server.
category: "General"
owner: "Ninkxz"
artifacts:
- "Jellyfin.Plugin.Shoal.dll"
changelog: >
  You can now delete a local movie from this server the way Jellyfin does: pick it in the Shoal library page and it is removed from your library and from disk. It works on network shares. You can tick several movies and delete them in one go. There is no recovery folder any more. Originals that an older version already put on hold keep a Restore list, so they can still be brought back. Deletion stays off until you switch it on, and it asks for confirmation. Requires Jellyfin 12.1 or newer. Both servers in a share should run 2.10.4. Back up Shoal data before you upgrade.
