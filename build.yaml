name: "Shoal"
guid: "b3d48170-08c3-4272-8042-efb38df9bb24"
version: "2.9.2.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Share libraries between friends' Jellyfin servers. Nothing copied, nothing exposed."
description: >
  Shoal for Jellyfin: a friend's titles show up in your library as lightweight
  .strm/.nfo entries and play through an authenticated plugin proxy, with the
  friend's server deciding between direct play and transcoding for your client.
  Nothing is copied and nothing is exposed.
category: "General"
owner: "Ninkxz"
artifacts:
- "Jellyfin.Plugin.Shoal.dll"
changelog: >
  Shoal 2.9.2 (includes 2.9.1): friend titles now say which friend hosts them and carry a Shared by entry in the Studios filter. A friend server only lists libraries it shares with you, and a picked library can no longer be swapped for another with the same name. TV shows from friends are always on (servers that had TV off start syncing their mapped TV libraries on the next sync). Held titles show real examples, a stopped play frees its stream slot at once, a refused play says why, and removing a server or library clears its empty library. Fixes Remove library. The first sync after upgrading rewrites friend titles once. Back up the shoal data folder first.
