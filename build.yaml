name: "Shoal"
guid: "b3d48170-08c3-4272-8042-efb38df9bb24"
version: "2.9.3.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Share libraries between friends' Jellyfin servers. Nothing copied, nothing exposed."
description: >
  Shoal for Jellyfin: a friend's titles show up in your library as lightweight
  .strm/.nfo entries and play through an authenticated plugin proxy, with the
  friend's server deciding between direct play and transcoding for your client.
  Nothing is copied and nothing is exposed.
category: "General"
owner: "Ninkxz"
artifacts:
- "Jellyfin.Plugin.Shoal.dll"
changelog: >
  Shoal 2.9.3: fixes a bug where a series shared by more than one friend got a new duplicate folder on every sync; Shoal now cleans up the old copies on the second sync after you upgrade. The Overview no longer repeats the server list after you open a friend and go back. A friend is one entry with its libraries added together, library rows show who can really see them, and a friend name can no longer carry a link into descriptions.
