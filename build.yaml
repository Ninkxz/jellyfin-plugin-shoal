name: "Shoal"
guid: "b3d48170-08c3-4272-8042-efb38df9bb24"
version: "2.10.0.3"
targetAbi: "12.1.0.0"
framework: "net10.0"
overview: "Share libraries between friends' Jellyfin servers. Media stays on its original server."
description: >
  Shoal for Jellyfin: a friend's titles show up in your library as lightweight
  .strm/.nfo entries and play through an authenticated plugin proxy, with the
  friend's server deciding between direct play and transcoding for your client.
  Media stays on its original server.
category: "General"
owner: "Ninkxz"
artifacts:
- "Jellyfin.Plugin.Shoal.dll"
changelog: >
  Keep My Place is enabled by default: compatible watched status and resume positions follow shared titles to local media for the same local user. Existing local history and saved off settings are preserved. Safer catalog recovery, conflicting TV identity and overlapping episode handling; clearer admin settings and recovery guidance; protective image and request failure handling. Requires Jellyfin 12.1 or newer. Recovery status accurately reports pending work. Back up Shoal's data folder before upgrading. Uncertain catalogs or episode ranges pause affected changes for review.
